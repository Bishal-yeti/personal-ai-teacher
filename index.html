<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal AI Teacher — Intelligent Learning & Study Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Sleek custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.45); }
    .math-block {
      font-family: 'Cambria Math', 'Times New Roman', serif;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased font-sans h-screen flex flex-col overflow-hidden selection:bg-blue-600 selection:text-white">

  <!-- Top Navigation Header -->
  <header class="h-14 border-b border-slate-800 bg-slate-900/80 backdrop-blur px-5 flex items-center justify-between z-20 flex-shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-md shadow-blue-500/20">
        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <div>
        <h1 class="font-bold text-sm text-white flex items-center gap-2">
          <span>Personal AI Teacher</span>
          <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold">
            Understanding First
          </span>
        </h1>
      </div>
    </div>

    <!-- Active Course Pill & Quick Action -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 px-3 py-1 rounded-lg bg-slate-800/80 border border-slate-700/60 text-xs">
        <span class="text-slate-400">Subject:</span>
        <select id="course-selector" onchange="switchCourse(this.value)" class="bg-transparent text-blue-400 font-semibold focus:outline-none cursor-pointer">
          <option value="mech" class="bg-slate-900 text-slate-200">Engineering Mechanics & Dynamics</option>
          <option value="calc" class="bg-slate-900 text-slate-200">Engineering Mathematics & Calculus</option>
          <option value="thermo" class="bg-slate-900 text-slate-200">Thermodynamics & Energy Systems</option>
        </select>
      </div>

      <button id="enlarge-workarea-btn" onclick="toggleWorkAreaEnlarge()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80 font-semibold text-xs flex items-center gap-1.5 transition" title="Toggle Fullscreen / Focus Mode">
        <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
        </svg>
        <span id="enlarge-btn-label">Enlarge Work Area</span>
      </button>

      <button onclick="navigateTo('tutor', 'zero')" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs shadow-sm shadow-blue-600/30 flex items-center gap-1.5 transition">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span>Ask Professor</span>
      </button>
    </div>
  </header>

  <!-- Workspace Shell -->
  <div class="flex-1 flex overflow-hidden">
    <!-- Sidebar Navigation -->
    <aside class="w-60 bg-slate-900 border-r border-slate-800 flex flex-col h-full flex-shrink-0 select-none">
      <nav class="flex-1 overflow-y-auto p-3 space-y-1">
        <button onclick="navigateTo('dashboard')" id="nav-dashboard" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white transition">
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Dashboard</span>
          </div>
        </button>

        <button onclick="navigateTo('tutor')" id="nav-tutor" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition">
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span>AI Professor Tutor</span>
          </div>
          <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-300">5 Modes</span>
        </button>

        <button onclick="navigateTo('solver')" id="nav-solver" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition">
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
            <span>Math & Kinetics Solver</span>
          </div>
          <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">SymPy</span>
        </button>

        <button onclick="navigateTo('visualizer')" id="nav-visualizer" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition">
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/></svg>
            <span>Interactive Visuals</span>
          </div>
          <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300">Canvas</span>
        </button>

        <button onclick="navigateTo('materials')" id="nav-materials" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition">
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span>Document Vault & RAG</span>
          </div>
        </button>

        <button onclick="navigateTo('practice')" id="nav-practice" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition">
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
            <span>Practice & Exam Engine</span>
          </div>
        </button>

        <button onclick="navigateTo('analytics')" id="nav-analytics" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition">
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Mastery Matrix</span>
          </div>
        </button>

        <button onclick="navigateTo('notes')" id="nav-notes" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition">
          <div class="flex items-center gap-2.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span>Formula Revision Sheets</span>
          </div>
        </button>
      </nav>

      <!-- Knowledge Base Status Footer -->
      <div class="p-3 border-t border-slate-800 bg-slate-900/60 text-[11px] text-slate-400 space-y-1">
        <div class="flex items-center justify-between">
          <span>Provenance Index:</span>
          <span class="text-emerald-400 font-mono font-semibold">Verified Pages</span>
        </div>
        <div class="flex items-center justify-between">
          <span>AI Engine:</span>
          <span class="text-blue-400 font-mono">Autonomous Pedagogy</span>
        </div>
      </div>
    </aside>

    <!-- Main Viewport Pane -->
    <main class="flex-1 overflow-y-auto bg-slate-950 p-6" id="main-viewport">
      <!-- Dynamic Views Injected Here via JavaScript -->
    </main>
  </div>

  <script>
    function toggleWorkAreaEnlarge() {
      state.isExpandedWorkArea = !state.isExpandedWorkArea;
      const sidebar = document.querySelector('aside');
      const viewport = document.getElementById('main-viewport');
      const label = document.getElementById('enlarge-btn-label');
      const btn = document.getElementById('enlarge-workarea-btn');

      if (state.isExpandedWorkArea) {
        if (sidebar) sidebar.classList.add('hidden');
        if (viewport) {
          viewport.classList.remove('p-6');
          viewport.classList.add('p-2');
        }
        if (label) label.textContent = 'Exit Focus Mode';
        if (btn) btn.className = "px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs flex items-center gap-1.5 transition shadow-sm shadow-blue-500/30";
      } else {
        if (sidebar) sidebar.classList.remove('hidden');
        if (viewport) {
          viewport.classList.remove('p-2');
          viewport.classList.add('p-6');
        }
        if (label) label.textContent = 'Enlarge Work Area';
        if (btn) btn.className = "px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700/80 font-semibold text-xs flex items-center gap-1.5 transition";
      }

      // Re-render current view with new dimensions
      renderCurrentView();
    }

    function setTutorLayoutMode(layout) {
      state.tutorLayoutMode = layout;
      renderCurrentView();
    }

    // Global Application State
    const state = {
      activeCourse: 'mech',
      isExpandedWorkArea: false,
      tutorLayoutMode: 'split', // 'split' | 'chat' | 'sketch'
      practiceTier: 'slide', // 'slide' | 'beyond'
      currentTab: 'dashboard',
      courses: {
        mech: {
          id: 'course-mech-101',
          title: 'Engineering Mechanics & Dynamics',
          code: 'ME-201',
          category: 'Mechanical Engineering',
          mastery: 74.5,
          topics: [
            { name: "Newton's Laws of Motion", score: 85.0, attempts: 12, misconceptions: ["Sign error in normal force components on slope"] },
            { name: "Kinematics of Particles", score: 70.0, attempts: 10, misconceptions: ["Confusing instantaneous velocity with average speed"] },
            { name: "Work and Kinetic Energy", score: 55.0, attempts: 8, misconceptions: ["Neglecting non-conservative friction work"] },
            { name: "Planar Rigid Body Motion", score: 35.0, attempts: 6, misconceptions: ["Instantaneous center of zero velocity identification"] }
          ],
          documents: [
            { name: "Lecture_04_Newtons_Laws.pdf", pages: 28, chunks: 34, type: "Lecture Notes" },
            { name: "Hibbeler_Engineering_Mechanics_Ch13.pdf", pages: 42, chunks: 52, type: "Reference Textbook" }
          ]
        },
        calc: {
          id: 'course-math-201',
          title: 'Engineering Mathematics & Calculus',
          code: 'MATH-301',
          category: 'Mathematics',
          mastery: 81.0,
          topics: [
            { name: "Multivariate Differentiation", score: 90.0, attempts: 15, misconceptions: [] },
            { name: "First-Order Differential Equations", score: 80.0, attempts: 11, misconceptions: ["Separation of variables integration constant"] },
            { name: "Laplace Transforms", score: 62.0, attempts: 7, misconceptions: ["Inverse transform shift theorem"] }
          ],
          documents: [
            { name: "Stewart_Calculus_Differential_Equations.pdf", pages: 35, chunks: 40, type: "Reference Textbook" }
          ]
        },
        thermo: {
          id: 'course-thermo-301',
          title: 'Thermodynamics & Energy Systems',
          code: 'ME-303',
          category: 'Thermal Engineering',
          mastery: 65.0,
          topics: [
            { name: "First Law & Energy Conservation", score: 80.0, attempts: 9, misconceptions: [] },
            { name: "Carnot & Rankine Power Cycles", score: 58.0, attempts: 6, misconceptions: ["Confusing isentropic expansion with isothermal"] },
            { name: "Entropy Generation", score: 50.0, attempts: 5, misconceptions: ["Reversible vs irreversible boundary work"] }
          ],
          documents: [
            { name: "Cengel_Thermodynamics_Cycles.pdf", pages: 48, chunks: 60, type: "Lecture Notes" }
          ]
        }
      },
      chatMessages: [
        {
          role: 'assistant',
          mode: 'zero',
          content: `### 🎓 Welcome to Personal AI Teacher
I am your personal university professor available 24/7. My job is to ensure you develop genuine physical intuition and deep mathematical mastery.

Whenever you ask a question or submit a problem, I will:
1. Break down the intuitive physical principle.
2. Formulate governing equations from first principles.
3. Show every algebraic derivation step without skipping math.
4. Verify units and physical boundary conditions.
5. Highlight common misconceptions and traps.

Try asking about **Newton's Laws on an Incline with Friction**, requesting a **differential equation derivation**, or testing yourself with a **Socratic inquiry**!`,
          citations: [
            { file: "Lecture_04_Newtons_Laws.pdf", page: 24, heading: "3.2 Planar Motion on Inclines" }
          ]
        }
      ],
      // Interactive Simulators State
      tutorWorkbenchTab: 'sketch',
      sketchpad: {
        color: '#f8fafc',
        size: 3,
        tool: 'pen',
        hasGrid: true,
        notes: ''
      },
      fbd: { mass: 10, angle: 30, mu: 0.25, applied: 0 },
      projectile: { v0: 25, angle: 45, g: 9.81 },
      carnot: { th: 600, tc: 300 }
    };

    function switchCourse(courseKey) {
      state.activeCourse = courseKey;
      renderCurrentView();
    }

    function navigateTo(tab, subOpt) {
      state.currentTab = tab;
      
      // Update sidebar nav highlighting
      ['dashboard', 'tutor', 'solver', 'visualizer', 'materials', 'practice', 'analytics', 'notes'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (!btn) return;
        if (t === tab) {
          btn.className = "w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold bg-blue-600 text-white shadow-sm transition";
        } else {
          btn.className = "w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition";
        }
      });

      renderCurrentView(subOpt);
    }

    function renderCurrentView(subOpt) {
      const viewport = document.getElementById('main-viewport');
      const c = state.courses[state.activeCourse];

      if (state.currentTab === 'dashboard') {
        renderDashboard(viewport, c);
      } else if (state.currentTab === 'tutor') {
        renderTutor(viewport, c, subOpt);
      } else if (state.currentTab === 'solver') {
        renderSolver(viewport, c);
      } else if (state.currentTab === 'visualizer') {
        renderVisualizer(viewport, c);
      } else if (state.currentTab === 'materials') {
        renderMaterials(viewport, c);
      } else if (state.currentTab === 'practice') {
        renderPractice(viewport, c, subOpt);
      } else if (state.currentTab === 'analytics') {
        renderAnalytics(viewport, c);
      } else if (state.currentTab === 'notes') {
        renderNotes(viewport, c);
      }
    }

    /* ---------------- 1. DASHBOARD VIEW ---------------- */
    function renderDashboard(container, c) {
      const weak = c.topics.filter(t => t.score < 65);
      container.innerHTML = `
        <div class="max-w-6xl mx-auto space-y-6">
          <!-- Hero Banner -->
          <div class="p-6 rounded-2xl bg-gradient-to-r from-blue-950 via-slate-900 to-indigo-950 border border-blue-900/40 shadow-xl space-y-3">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-400/20 text-blue-300 text-xs font-semibold">
              <span>★ 24/7 Professor Study Assistant Active</span>
            </div>
            <h2 class="text-2xl font-black text-white tracking-tight">
              Prioritize Deep Understanding Over Just Answering.
            </h2>
            <p class="text-xs text-slate-300 max-w-2xl leading-relaxed">
              We teach you <em>why</em> principles work rather than spoon-feeding raw values. Explore step-by-step calculus derivations, real-time force balance simulators, and authentic textbook citations.
            </p>
            <div class="flex flex-wrap gap-2.5 pt-1">
              <button onclick="navigateTo('tutor', 'zero')" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs shadow-md shadow-blue-600/30 transition">
                Start "Learn From Zero"
              </button>
              <button onclick="navigateTo('solver')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold transition">
                Solve Kinetics with SymPy
              </button>
              <button onclick="navigateTo('visualizer')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold transition">
                Inspect Interactive FBD
              </button>
            </div>
          </div>

          <!-- Metrics Row -->
          <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
            <div class="p-4 rounded-xl bg-slate-900 border border-slate-800">
              <span class="text-[11px] text-slate-400 font-medium">Active Subject</span>
              <h3 class="text-sm font-bold text-white mt-1 truncate">${c.title}</h3>
              <span class="text-[10px] text-blue-400 font-mono">${c.code}</span>
            </div>
            <div class="p-4 rounded-xl bg-slate-900 border border-slate-800">
              <span class="text-[11px] text-slate-400 font-medium">Evidence-Based Mastery</span>
              <h3 class="text-2xl font-black text-emerald-400 mt-1">${c.mastery}%</h3>
              <span class="text-[10px] text-emerald-400/80">Calculated from tests</span>
            </div>
            <div class="p-4 rounded-xl bg-slate-900 border border-slate-800">
              <span class="text-[11px] text-slate-400 font-medium">Vault Materials</span>
              <h3 class="text-2xl font-black text-purple-400 mt-1">${c.documents.length} Files</h3>
              <span class="text-[10px] text-slate-400">Indexed with page citations</span>
            </div>
            <div class="p-4 rounded-xl bg-slate-900 border border-slate-800">
              <span class="text-[11px] text-slate-400 font-medium">Weak Topics for Revision</span>
              <h3 class="text-2xl font-black text-amber-400 mt-1">${weak.length}</h3>
              <span class="text-[10px] text-amber-400/80">Proficiency below 65%</span>
            </div>
          </div>

          <!-- 2 Column: Knowledge Mastery Breakdown & Weak Focus -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
              <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h3 class="text-sm font-bold text-white">Genuine Topic Mastery Matrix</h3>
                <button onclick="navigateTo('analytics')" class="text-xs text-blue-400 hover:text-blue-300 font-semibold">View Planner →</button>
              </div>
              <div class="space-y-3">
                ${c.topics.map(t => `
                  <div class="p-3 rounded-xl bg-slate-800/40 border border-slate-800 space-y-1.5">
                    <div class="flex items-center justify-between text-xs">
                      <span class="font-semibold text-slate-200">${t.name}</span>
                      <span class="font-mono font-bold ${t.score >= 80 ? 'text-emerald-400' : (t.score >= 60 ? 'text-blue-400' : 'text-amber-400')}">${t.score}%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                      <div class="h-full rounded-full ${t.score >= 80 ? 'bg-emerald-500' : (t.score >= 60 ? 'bg-blue-500' : 'bg-amber-500')}" style="width: ${t.score}%"></div>
                    </div>
                    ${t.misconceptions && t.misconceptions.length > 0 ? `
                      <p class="text-[10px] text-amber-300/90 pt-0.5">⚠️ Frequent Trap: ${t.misconceptions[0]}</p>
                    ` : ''}
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Weak Areas Card -->
            <div class="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-4 flex flex-col justify-between">
              <div>
                <h3 class="text-sm font-bold text-white border-b border-slate-800 pb-2 flex items-center gap-1.5">
                  <span class="text-amber-400">⚠️</span>
                  <span>Revision Priority</span>
                </h3>
                <div class="space-y-3 pt-3">
                  ${weak.map(w => `
                    <div class="p-3 rounded-lg bg-amber-500/5 border border-amber-500/20 text-xs space-y-1">
                      <div class="flex justify-between font-bold text-slate-200">
                        <span>${w.name}</span>
                        <span class="text-amber-400 font-mono">${w.score}%</span>
                      </div>
                      <p class="text-[11px] text-slate-400">Review foundational theorems before exam.</p>
                      <button onclick="navigateTo('practice', '${w.name}')" class="mt-1 px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[10px] font-semibold hover:bg-amber-500/30">
                        Take Remedial Quiz →
                      </button>
                    </div>
                  `).join('')}
                </div>
              </div>

              <button onclick="navigateTo('practice')" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs border border-slate-700 transition">
                Start Topic Assessment
              </button>
            </div>
          </div>
        </div>
      `;
    }

    /* ---------------- SKETCHPAD & NOTEBOOK LOGIC ---------------- */
    let sketchpadCanvas = null;
    let sketchpadCtx = null;
    let isDrawingSketch = false;
    let sketchLastX = 0;
    let sketchLastY = 0;

    function initSketchpad() {
      sketchpadCanvas = document.getElementById('sketchpad-canvas');
      if (!sketchpadCanvas) return;
      sketchpadCtx = sketchpadCanvas.getContext('2d');

      const rect = sketchpadCanvas.getBoundingClientRect();
      sketchpadCanvas.width = rect.width || 420;
      const targetHeight = state.tutorLayoutMode === 'sketch' ? 380 : 230;
      sketchpadCanvas.height = targetHeight;

      redrawCanvas();

      function getCoords(e) {
        const r = sketchpadCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - r.left,
          y: clientY - r.top
        };
      }

      function startDraw(e) {
        isDrawingSketch = true;
        const coords = getCoords(e);
        sketchLastX = coords.x;
        sketchLastY = coords.y;
      }

      function draw(e) {
        if (!isDrawingSketch || !sketchpadCtx) return;
        e.preventDefault();
        const coords = getCoords(e);
        sketchpadCtx.beginPath();
        sketchpadCtx.moveTo(sketchLastX, sketchLastY);
        sketchpadCtx.lineTo(coords.x, coords.y);
        sketchpadCtx.strokeStyle = state.sketchpad.tool === 'eraser' ? '#020617' : state.sketchpad.color;
        sketchpadCtx.lineWidth = state.sketchpad.tool === 'eraser' ? state.sketchpad.size * 5 : state.sketchpad.size;
        sketchpadCtx.lineCap = 'round';
        sketchpadCtx.lineJoin = 'round';
        sketchpadCtx.stroke();
        sketchLastX = coords.x;
        sketchLastY = coords.y;
      }

      function stopDraw() {
        isDrawingSketch = false;
      }

      sketchpadCanvas.onmousedown = startDraw;
      sketchpadCanvas.onmousemove = draw;
      sketchpadCanvas.onmouseup = stopDraw;
      sketchpadCanvas.onmouseleave = stopDraw;

      sketchpadCanvas.ontouchstart = startDraw;
      sketchpadCanvas.ontouchmove = draw;
      sketchpadCanvas.ontouchend = stopDraw;
    }

    function redrawCanvas() {
      if (!sketchpadCanvas || !sketchpadCtx) return;
      sketchpadCtx.fillStyle = '#020617';
      sketchpadCtx.fillRect(0, 0, sketchpadCanvas.width, sketchpadCanvas.height);

      if (state.sketchpad.hasGrid) {
        sketchpadCtx.strokeStyle = 'rgba(51, 65, 85, 0.35)';
        sketchpadCtx.lineWidth = 1;
        const step = 20;
        for (let x = step; x < sketchpadCanvas.width; x += step) {
          sketchpadCtx.beginPath();
          sketchpadCtx.moveTo(x, 0);
          sketchpadCtx.lineTo(x, sketchpadCanvas.height);
          sketchpadCtx.stroke();
        }
        for (let y = step; y < sketchpadCanvas.height; y += step) {
          sketchpadCtx.beginPath();
          sketchpadCtx.moveTo(0, y);
          sketchpadCtx.lineTo(sketchpadCanvas.width, y);
          sketchpadCtx.stroke();
        }
      }
    }

    function clearSketchpad() {
      redrawCanvas();

    function processUploadedFiles(files) {
      if (!files || files.length === 0) return;

      const activeC = state.courses[state.activeCourse];
      const addedDocs = [];

      files.forEach(file => {
        const isPdf = file.name.toLowerCase().endsWith('.pdf');
        const estimatedPages = isPdf ? Math.max(1, Math.min(250, Math.round(file.size / 45000))) : Math.max(1, Math.round(file.size / 20000));
        const estimatedChunks = Math.max(2, Math.round(estimatedPages * 1.4));

        const newDoc = {
          name: file.name,
          pages: estimatedPages,
          chunks: estimatedChunks,
          size: (file.size / 1024).toFixed(1) + ' KB',
          type: isPdf ? 'Lecture / Slide PDF' : 'Document'

        activeC.documents.unshift(newDoc); // add to top
        addedDocs.push(newDoc);

      if (cat === 'diff') {

      } else if (cat === 'integral') {
        resBox.innerText = "∫ [0 to 4] (3*x^2 - 4*x + 5) dx = 52.0";
        stepsBox.innerHTML = `
          <div class="p-3.5 rounded-xl bg-slate-800/40 border border-slate-800 space-y-1 text-xs">
            <span class="font-bold text-slate-200">Step 1: Antiderivative F(x)</span>

            <span class="font-bold text-slate-200">Step 2: Fundamental Theorem of Calculus F(4) - F(0)</span>

        const th = parseFloat(document.getElementById('solver-th')?.value || 30);
        const mu = parseFloat(document.getElementById('solver-mu')?.value || 0.2);
        const rad = (th * Math.PI) / 180;
        const g = 9.81;

        const Wy = m * g * Math.cos(rad);
        const fk = mu * Wy;
        const a = (Wx - fk) / m;

        resBox.innerText = `Acceleration a = ${a.toFixed(3)} m/s² (Downwards along slope)`;

    function updateFBD(key, val) {
      state.fbd[key] = parseFloat(val);
      const angleEl = document.getElementById('fbd-angle-val');
      const massEl = document.getElementById('fbd-mass-val');
      const muEl = document.getElementById('fbd-mu-val');

    function drawFBDCanvas() {
      const canvas = document.getElementById('fbd-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const { mass, angle, mu } = state.fbd;
      const g = 9.81;
      const rad = (angle * Math.PI) / 180;
      const W = mass * g;
      const Wperp = W * Math.cos(rad);
      const Wpar = W * Math.sin(rad);
      const N = Wperp;
      const fk = mu * N;
      const a = (Wpar - fk) / mass;

      // Update readouts
      const readouts = document.getElementById('fbd-readouts');
      if (readouts) {
        readouts.innerHTML = `
          <div class="flex justify-between text-slate-400"><span>Normal Force (N):</span><span class="text-emerald-400 font-mono">${N.toFixed(1)} N</span></div>
          <div class="flex justify-between text-slate-400"><span>Friction Force (f_k):</span><span class="text-amber-400 font-mono">${fk.toFixed(1)} N</span></div>
          <div class="flex justify-between text-slate-400"><span>Weight Parallel (W_x):</span><span class="text-red-400 font-mono">${Wpar.toFixed(1)} N</span></div>
          <div class="flex justify-between text-slate-200 font-bold pt-1.5 border-t border-slate-800"><span>Acceleration (a):</span><span class="text-blue-400 font-mono">${a.toFixed(2)} m/s²</span></div>
        `;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const w = canvas.width;
      const h = canvas.height;

      const ox = 90;
      const oy = h - 80;
      const rampLen = 340;
      const ex = ox + rampLen * Math.cos(rad);
      const ey = oy - rampLen * Math.sin(rad);

      // Incline Ramp
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(ox - 30, oy);
      ctx.lineTo(ox, oy);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      // Ground wedge fill
      ctx.fillStyle = 'rgba(51, 65, 85, 0.2)';
      ctx.beginPath();
      ctx.moveTo(ox, oy);
      ctx.lineTo(ex, ey);
      ctx.lineTo(ex, oy);
      ctx.closePath();
      ctx.fill();

      // Block halfway up ramp
      const bDist = 180;
      const bx = ox + bDist * Math.cos(rad);
      const by = oy - bDist * Math.sin(rad);

      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(-rad);

      // Block Rect
      const bw = 54;
      const bh = 36;
      ctx.fillStyle = '#3b82f6';
      ctx.strokeStyle = '#60a5fa';
      ctx.lineWidth = 2;
      ctx.fillRect(-bw/2, -bh, bw, bh);
      ctx.strokeRect(-bw/2, -bh, bw, bh);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${mass} kg`, 0, -bh/2 + 4);

      // Normal Vector (up perpendicular)
      const nLen = Math.min(90, Math.max(20, N * 0.7));
      drawVec(ctx, 0, -bh/2, 0, -bh/2 - nLen, '#10b981', `N=${N.toFixed(0)}N`);

      // Friction Vector (up the ramp opposing motion)
      const fLen = Math.min(80, Math.max(15, fk * 1.5));
      drawVec(ctx, 0, -bh/2, fLen, -bh/2, '#f59e0b', `f_k=${fk.toFixed(0)}N`);

      ctx.restore();

      // Gravity Vector (straight down)
      const wLen = Math.min(100, Math.max(25, W * 0.6));
      drawVec(ctx, bx, by - 15, bx, by - 15 + wLen, '#ef4444', `W=${W.toFixed(0)}N`);
    }

    function drawVec(ctx, x1, y1, x2, y2, color, label) {
      const head = 7;
      const ang = Math.atan2(y2 - y1, x2 - x1);
      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - head * Math.cos(ang - Math.PI/6), y2 - head * Math.sin(ang - Math.PI/6));
      ctx.lineTo(x2 - head * Math.cos(ang + Math.PI/6), y2 - head * Math.sin(ang + Math.PI/6));
      ctx.closePath();
      ctx.fill();

      if (label) {
        ctx.font = '10px monospace';
        ctx.fillText(label, x2 + 4, y2 - 4);
      }
      ctx.restore();
    }
